# Weekly version-update PRs. The example site's Astro version is the canary: if a new Astro
# release breaks the theme, the CI run on Dependabot's PR shows it before the sites upgrade.
version: 2

updates:
  - package-ecosystem: npm
    directory: /example
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
