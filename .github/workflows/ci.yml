name: CI

# Builds the example site (example/) against the theme in this PR, prints both CVs and checks
# dist/, then scans the history for secrets. This is what a theme change must pass before both
# sites can bump their `theme` pointer to it.
#
# Kept cheap and hard to abuse:
# - Runs on pull_request (never pull_request_target): fork PRs get a read-only token and no
#   secrets. Workflows from outside contributors also need the owner's approval before they
#   run (Settings → Actions → General → "Require approval for all external contributors").
# - Cancels superseded runs of the same PR and has short timeouts. It runs on every PR, docs
#   included, because build and gitleaks are required checks: a skipped run never reports, and
#   GitHub would block the PR forever. Both jobs together take well under a minute.
# - No push trigger: the PR run already tested the merge result's commits.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: example/.node-version
          cache: npm
          cache-dependency-path: example/package-lock.json

      # postinstall links example/node_modules to ./node_modules, so the theme's own files
      # (outside example/) resolve astro and yaml, as they do inside a real site.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the example site (validates the YAML against the theme's schema)
        run: npm run build

      - name: Print both CVs with headless Chrome
        env:
          CHROME: google-chrome
          CHROME_FLAGS: --no-sandbox
          CV_OUT_DIR: dist
        run: ./scripts/build-cv.sh

      - name: Check dist/
        run: ./scripts/check-dist.sh

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: gitleaks (fails if any secret is found)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --exit-code 1
